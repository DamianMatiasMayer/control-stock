spring.application.name=control-stock

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:stockdb
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en /h2-console (para ver las tablas durante el desarrollo)
spring.h2.console.enabled=true

# --- JPA / Hibernate ---
# Crea las tablas a partir de las entidades al arrancar y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
# Toda consulta a la base pasa por la capa de servicio, no por la vista
spring.jpa.open-in-view=false
# Muestra en la terminal las consultas SQL que ejecuta Hibernate
spring.jpa.show-sql=true

# --- Errores ---
# Nunca mostrar trazas internas ni mensajes técnicos al usuario
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never